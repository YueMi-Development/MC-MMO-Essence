# Stats display configuration for MC-MMO-Essence
# Each element defines its slot, color, and display settings

# Element configurations
# Keys must match element names in config.yml
elements:
  FIRE:
    # Display name in GUI (MiniMessage format)
    name: "<red>Fire"
    # Item color for the element icon
    color: "RED"
    # Lore lines shown on hover (supports {current} and {max} placeholders)
    lore:
      - "<gray>Essence Level: <red>{current}<gray>/<red>{max}"
      - "<gray>Progress: <red>{percent}%"
    # Slot position in GUI
    slot: 11
    # Weakness elements (for display purposes)
    weakness:
      - "WATER"
    
  WATER:
    name: "<blue>Water"
    color: "BLUE"
    lore:
      - "<gray>Essence Level: <blue>{current}<gray>/<blue>{max}"
      - "<gray>Progress: <blue>{percent}%"
    slot: 12
    weakness:
      - "FIRE"
      
  EARTH:
    name: "<green>Earth"
    color: "GREEN"
    lore:
      - "<gray>Essence Level: <green>{current}<gray>/<green>{max}"
      - "<gray>Progress: <green>{percent}%"
    slot: 13
    weakness:
      - "WIND"
      
  WIND:
    name: "<white>Wind"
    color: "WHITE"
    lore:
      - "<gray>Essence Level: <white>{current}<gray>/<white>{max}"
      - "<gray>Progress: <white>{percent}%"
    slot: 14
    weakness:
      - "EARTH"
      
  DARK:
    name: "<dark_gray>Dark"
    color: "GRAY"
    lore:
      - "<gray>Essence Level: <dark_gray>{current}<gray>/<dark_gray>{max}"
      - "<gray>Progress: <dark_gray>{percent}%"
    slot: 15
    weakness:
      - "LIGHT"
      
  LIGHT:
    name: "<yellow>Light"
    color: "YELLOW"
    lore:
      - "<gray>Essence Level: <yellow>{current}<gray>/<yellow>{max}"
      - "<gray>Progress: <yellow>{percent}%"
    slot: 16
    weakness:
      - "DARK"
